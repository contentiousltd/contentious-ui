<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<title>Analysis — Catalogue &amp; Runs</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="variants/shared.jsx"></script>
<script type="text/babel" src="variants/shared_v2.jsx"></script>
<script type="text/babel" src="variants/inventory_estate.jsx"></script>
<script type="text/babel" src="variants/analysis_catalogue.jsx"></script>

<script type="text/babel">
const accent = getComputedStyle(document.documentElement).getPropertyValue('--fire-500').trim() || '#D5544F';

function App() {
  return (
    <DesignCanvas>

      {/* ── Intro ──────────────────────────────────────────────────────────── */}
      <div style={{ padding: '0 60px 40px', maxWidth: 1000 }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '.08em', textTransform: 'uppercase', color: 'rgba(60,50,40,0.5)', marginBottom: 10 }}>Analysis · Levels 3 &amp; 4 of the four-tier model</div>
        <h1 style={{ fontFamily: 'var(--font-heading-display)', fontSize: 56, fontWeight: 400, color: '#1a1918', margin: '0 0 14px', lineHeight: 1.02 }}>Analysis, reimagined.</h1>
        <p style={{ fontFamily: 'var(--font-body)', fontSize: 16, color: '#3d3c3a', maxWidth: '64ch', lineHeight: 1.55, margin: '0 0 10px' }}>
          The Analysis section is redesigned around the catalogue — the curated set of pages you've chosen to monitor. "Add to catalogue" in Inventory is the handoff gesture; this is its natural destination.
        </p>
        <p style={{ fontFamily: 'var(--font-body)', fontSize: 15, color: '#5a524a', maxWidth: '64ch', margin: '0 0 10px' }}>
          <b>The current two-column layout is dropped.</b> The URL-input form on the left and the runs list on the right served the old model — add URLs, run them. The new model inverts this: your catalogue is always in view, and running analysis means running it <em>against the catalogue</em>, not assembling a fresh queue each time.
        </p>
        <p style={{ fontFamily: 'var(--font-body)', fontSize: 15, color: '#5a524a', maxWidth: '64ch', margin: 0 }}>
          Three navigation options are explored below. All share the same catalogue table and run-trigger pattern — the question is just where "Catalogue" lives relative to "Analysis" in the IA. Artboards D and E show the run trigger and in-progress states shared across all options.
        </p>
      </div>

      {/* ── A · Sub-nav: Catalogue | Run history ───────────────────────────── */}
      <DCSection
        title="A · Analysis — Catalogue as sub-nav tab"
        subtitle="The clearest IA separation. 'Analysis' in the top nav leads to a page with two tabs: Catalogue (the default) and Run history. The page title says 'Catalogue' — explicit, unambiguous. Run history is a badge-counted tab, one click away. This option works well if run history ever grows into a richer view of its own."
        gap={100}
      >
        <div style={{ position: 'relative' }}>
          <DCArtboard label="Analysis · Catalogue (sub-nav option)" width={1200} height={846}>
            <AB_SubNavCatalogue accent={accent}/>
          </DCArtboard>
          <DCPostIt top={80} right={-230} rotate={2} width={220}>
            Sub-nav tabs make the boundary explicit: "here is the catalogue, there is the run history." Good for users who want to orient quickly. Slight cost: an extra click to get from Analysis landing → run history.
          </DCPostIt>
          <DCPostIt top={320} right={-230} rotate={-2} width={220}>
            "14 need re-analysis" surfaces urgency in the header without a separate alert. The count is always visible — no banner to dismiss.
          </DCPostIt>
          <DCPostIt top={560} right={-230} rotate={1} width={220}>
            Table default sort: overdue + never-run pages float to the top. The status column is the primary signal, score is secondary. "Results →" only appears when a score exists.
          </DCPostIt>
        </div>
      </DCSection>

      {/* ── B · Single-page: Analysis IS the catalogue ─────────────────────── */}
      <DCSection
        title="B · Analysis — Catalogue as the page itself (no sub-nav)"
        subtitle="The simplest structure. Clicking 'Analysis' lands you on a full-width catalogue table — no sub-nav, no extra layer. The page title is 'Analysis'. Run history is collapsed at the bottom, always one click to expand. Status-count chips above the table act as both a summary and a filter. This is the most catalogue-forward option."
        gap={100}
      >
        <div style={{ position: 'relative' }}>
          <DCArtboard label="Analysis · Single-page catalogue" width={1200} height={1010}>
            <AB_SinglePage accent={accent}/>
          </DCArtboard>
          <DCPostIt top={80} right={-230} rotate={-2} width={220}>
            No sub-nav means no ambiguity about where you are. "Analysis" = catalogue. The mental model from the Inventory explainer carries directly: you curated the catalogue there, here you act on it.
          </DCPostIt>
          <DCPostIt top={360} right={-230} rotate={2} width={220}>
            Status chips (5 Overdue · 9 Never run · 51 Stale · 3 Up to date) are scannable before touching the table. Tapping one filters the list — a secondary interaction that doesn't clutter the default view.
          </DCPostIt>
          <DCPostIt top={660} right={-230} rotate={-1} width={220}>
            Recent runs is a persistent but secondary element. Collapsed by default — it's confirmation, not the primary workflow. Expand to see dates, page counts, and a link to Results.
          </DCPostIt>
        </div>
      </DCSection>

      {/* ── C · Priority-grouped ───────────────────────────────────────────── */}
      <DCSection
        title="C · Analysis — Priority-grouped (urgency as the headline)"
        subtitle="The most opinionated option. The page leads with 'X pages need attention' as its headline — the catalogue is presented as two groups: Needs attention (overdue + never run, highlighted) and Up to date (dimmed, collapsed by default). Designed for users who want to act fast on what's overdue rather than browse the full list."
        gap={100}
      >
        <div style={{ position: 'relative' }}>
          <DCArtboard label="Analysis · Priority-grouped" width={1200} height={964}>
            <AB_PriorityGrouped accent={accent}/>
          </DCArtboard>
          <DCPostIt top={80} right={-230} rotate={2} width={220}>
            The headline is the task, not the section name. "14 pages need attention" is a direct call to action — not a label. This framing is most useful for clients who open Analysis only when something is due.
          </DCPostIt>
          <DCPostIt top={300} right={-230} rotate={-2} width={220}>
            Red border on the "Needs attention" card ties the visual urgency to the data without an intrusive banner. The "Up to date" group is visually deprioritised — good for focus, potentially frustrating for users who want to browse everything.
          </DCPostIt>
          <DCPostIt top={660} right={-230} rotate={1} width={220}>
            Downside of this option: once all pages are up to date, the headline must change — you can't lead with "0 pages need attention" every time. Needs a graceful all-clear state.
          </DCPostIt>
        </div>
      </DCSection>

      {/* ── D · Run trigger modal ───────────────────────────────────────────── */}
      <DCSection
        title="D · Run analysis — trigger modal (shared across all options)"
        subtitle="Clicking 'Analyse catalogue' from any option opens this confirmation modal. Two scope choices: analyse all 68, or just the 14 that need attention. Key stats (page count, estimated time, concurrency) are shown upfront — no surprises. The email note is persistent: async analysis is the expectation, not a footnote."
        gap={100}
      >
        <div style={{ position: 'relative' }}>
          <DCArtboard label="Run trigger · Confirmation modal" width={1200} height={870}>
            <AB_RunTrigger accent={accent}/>
          </DCArtboard>
          <DCPostIt top={200} right={-230} rotate={-2} width={220}>
            "Analyse 14 pages needing attention" is a targeted option that saves time and quota. Useful for mid-month re-runs after content updates, or when new pages have been added to the catalogue since the last full run.
          </DCPostIt>
          <DCPostIt top={500} right={-230} rotate={2} width={220}>
            The email note ("You'll get an email when it's done") matches the existing product behaviour. No need to stay on the page — this is set-and-leave. The note is in the modal body, not the footer, so it's seen before committing.
          </DCPostIt>
        </div>
      </DCSection>

      {/* ── E · In-progress state ───────────────────────────────────────────── */}
      <DCSection
        title="E · Run analysis — in-progress state (shared across all options)"
        subtitle="After starting a run, the page stays put — no loading screen, no redirect. A slim progress banner appears below the top nav: live count, estimated time remaining, and an email reminder. The 'Analyse catalogue' button becomes 'Running…' (disabled). Table rows update in place as each page completes, changes to 'Analysing', or waits in the queue."
        gap={100}
      >
        <div style={{ position: 'relative' }}>
          <DCArtboard label="Run analysis · In-progress state" width={1200} height={880}>
            <AB_InProgress accent={accent}/>
          </DCArtboard>
          <DCPostIt top={80} right={-230} rotate={2} width={220}>
            The progress banner is unobtrusive: one line of text + a 3px bar. It doesn't interrupt the table — you can still scroll and read the catalogue while analysis runs in the background.
          </DCPostIt>
          <DCPostIt top={340} right={-230} rotate={-2} width={220}>
            Live row states: 'Complete' (green), 'Analysing' (spinner + accent), 'Queued' (unchanged status from before). The table becomes a live feed — you can see work progressing without polling or refreshing.
          </DCPostIt>
          <DCPostIt top={620} right={-230} rotate={1} width={220}>
            Open question: should rows that complete during a run show their new score immediately, or wait until the full run is done? Showing live scores is more satisfying; batching until complete is simpler to implement.
          </DCPostIt>
        </div>
      </DCSection>

      {/* ── Summary ─────────────────────────────────────────────────────────── */}
      <div style={{ padding: '40px 60px 80px', maxWidth: 960 }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '.08em', textTransform: 'uppercase', color: 'rgba(60,50,40,0.5)', marginBottom: 10 }}>Summary</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 40 }}>
          <div>
            <div style={{ fontFamily: 'var(--font-heading-display)', fontSize: 20, color: '#1a1918', marginBottom: 12 }}>What's settled</div>
            <ul style={{ fontFamily: 'var(--font-body)', fontSize: 15, color: '#3d3c3a', lineHeight: 1.75, paddingLeft: 18, margin: 0 }}>
              <li>Two-column format is gone — catalogue is the full-width default view</li>
              <li>Monthly schedule surfaced as ambient text, not a configurable control</li>
              <li>Run trigger is a modal with scope choice: full catalogue vs. attention-only</li>
              <li>In-progress is inline — no redirect, live row states, dismissible banner</li>
              <li>"Content Inventory" tab renamed to "Catalogue" across the product</li>
            </ul>
          </div>
          <div>
            <div style={{ fontFamily: 'var(--font-heading-display)', fontSize: 20, color: '#1a1918', marginBottom: 12 }}>Open questions</div>
            <ol style={{ fontFamily: 'var(--font-body)', fontSize: 15, color: '#3d3c3a', lineHeight: 1.75, paddingLeft: 20, margin: 0 }}>
              <li><b>Which nav option?</b> A (sub-nav) is explicit; B (single-page) is simplest; C (priority-grouped) is most opinionated.</li>
              <li><b>Live scores during a run?</b> Show new scores as pages complete, or batch on run completion?</li>
              <li><b>Empty catalogue state.</b> If no pages have been added to the catalogue yet, what does Analysis show? A prompt to go to Inventory, or an inline add-to-catalogue flow?</li>
              <li><b>Results link in the table.</b> Should it link to the specific run, or to the page's full result history?</li>
            </ol>
          </div>
        </div>
      </div>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
