<!-- @dsCard group="Colors" viewport="700x160" name="Chip tones" subtitle="Six tones, one geometry. Promo is the only solid fill." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);padding:18px 20px;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
a{color:var(--accent-link)}a:hover{color:var(--accent-link-hover)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:var(--chip-font-size);letter-spacing:var(--chip-tracking);text-transform:uppercase;line-height:1;padding:var(--chip-padding);border-radius:var(--chip-radius)}
.tbl{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.tbl div{font-size:10.5px;color:var(--text-muted);line-height:1.4}
.tbl b{display:block;font-family:var(--font-heading);font-weight:400;font-size:12px;color:var(--text-body);margin-bottom:3px}</style></head><body><div class="chips">
<span class="chip" style="background:var(--chip-neutral-bg);color:var(--chip-neutral-fg)">Member</span>
<span class="chip" style="background:var(--chip-info-bg);color:var(--chip-info-fg)">Current</span>
<span class="chip" style="background:var(--chip-good-bg);color:var(--chip-good-fg)">Healthy · 78</span>
<span class="chip" style="background:var(--chip-warn-bg);color:var(--chip-warn-fg)">Invited</span>
<span class="chip" style="background:var(--chip-bad-bg);color:var(--chip-bad-fg)">Failed</span>
<span class="chip" style="background:var(--chip-promo-bg);color:var(--chip-promo-fg)">2 months free</span>
</div>
<div class="tbl">
<div><b>neutral</b>plain fact – roles, types</div>
<div><b>info</b>positional, in-flight</div>
<div><b>good</b>good outcome</div>
<div><b>warn</b>incomplete, awaiting</div>
<div><b>bad</b>broken, needs attention</div>
<div><b>promo</b>offers only, one per screen</div>
</div></body></html>
