<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);padding:18px 20px;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
a{color:var(--accent-link)}a:hover{color:var(--accent-link-hover)}
.s{font:var(--type-section);color:var(--text-strong);margin:0 0 4px}
.r{font:var(--type-row-title);color:var(--text-strong);margin:16px 0 2px}
.u{font:var(--type-ui);color:var(--text-secondary);margin-top:16px}
.n{font-size:11px;color:var(--text-muted);margin-top:3px}</style></head><body><div class="mono">Bely · 400 / 700</div>
<div style="margin-top:10px"><div class="s">Queue health</div><div class="n">--type-section · 21px · section headers</div></div>
<div><div class="r">Oxfam 2</div><div class="n">--type-row-title · 17px · list rows, card titles</div></div>
<div><div class="u">Project settings</div><div class="n">--type-ui · 14px · tabs, menu items, buttons</div></div></body></html>
