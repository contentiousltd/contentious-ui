<!-- @dsCard group="Colors" viewport="700x160" name="Fire – the accent" subtitle="Solid = active or primary. Tint = status. Never interchange them." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);padding:18px 20px;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
a{color:var(--accent-link)}a:hover{color:var(--accent-link-hover)}
.grid{display:grid;grid-template-columns:repeat(17,1fr);gap:2px}.sw{height:44px;border-radius:3px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-family:var(--font-mono);font-size:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.demo{background:var(--surface-card);border-radius:6px;padding:13px 15px}
.demo .t{font-size:11px;color:var(--text-muted);margin-bottom:9px}
.btn{font-family:var(--font-heading);font-size:13px;background:var(--accent);color:var(--text-on-accent);border:0;border-radius:6px;padding:7px 13px}
.chip{display:inline-flex;font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:5px 7px;border-radius:3px;background:var(--chip-bad-bg);color:var(--chip-bad-fg)}</style></head><body><div class="grid"><div class="sw" style="background:var(--fire-100);color:var(--fire-800)">100</div><div class="sw" style="background:var(--fire-150);color:var(--fire-800)">150</div><div class="sw" style="background:var(--fire-200);color:var(--fire-800)">200</div><div class="sw" style="background:var(--fire-250);color:var(--fire-800)">250</div><div class="sw" style="background:var(--fire-300);color:var(--fire-800)">300</div><div class="sw" style="background:var(--fire-350);color:var(--fire-800)">350</div><div class="sw" style="background:var(--fire-400);color:var(--fire-800)">400</div><div class="sw" style="background:var(--fire-450);color:var(--fire-800)">450</div><div class="sw" style="background:var(--fire-500);color:var(--limestone-300)">500</div><div class="sw" style="background:var(--fire-550);color:var(--limestone-300)">550</div><div class="sw" style="background:var(--fire-600);color:var(--limestone-300)">600</div><div class="sw" style="background:var(--fire-650);color:var(--limestone-300)">650</div><div class="sw" style="background:var(--fire-700);color:var(--limestone-300)">700</div><div class="sw" style="background:var(--fire-750);color:var(--limestone-300)">750</div><div class="sw" style="background:var(--fire-800);color:var(--limestone-300)">800</div><div class="sw" style="background:var(--fire-850);color:var(--limestone-300)">850</div><div class="sw" style="background:var(--fire-900);color:var(--limestone-300)">900</div></div>
<div class="split">
<div class="demo"><div class="t">Solid – active / primary</div><button class="btn">Add client</button></div>
<div class="demo"><div class="t">Tint – status</div><span class="chip">Failed</span></div>
</div></body></html>
