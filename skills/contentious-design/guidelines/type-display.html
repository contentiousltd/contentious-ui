<!-- @dsCard group="Type" viewport="700x180" name="Bely Display" subtitle="Page titles and metric values only. Never below 30px, never synthesised bold." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);padding:18px 20px;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
a{color:var(--accent-link)}a:hover{color:var(--accent-link-hover)}
h1{font-family:var(--font-heading-display);font-weight:400;font-size:50px;line-height:1.02;color:var(--text-strong);margin:6px 0 10px;letter-spacing:-.005em}
.n{font-size:11.5px;color:var(--text-muted);line-height:1.5;max-width:60ch}</style></head><body><div class="mono">Bely Display · 400 · single cut</div>
<h1>Which one am I in?</h1>
<div class="n">One weight only. Browsers default headings to 700 and synthesise a fake bold, which thickens the ink and breaks the cut’s proportions – <span style="font-family:var(--font-mono);font-size:10.5px">font-synthesis-weight:none</span> is set globally.</div></body></html>
