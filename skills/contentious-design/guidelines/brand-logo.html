<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);padding:18px 20px;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
a{color:var(--accent-link)}a:hover{color:var(--accent-link-hover)}
.set{display:flex;align-items:center;gap:40px;margin-top:14px}
.lock{display:flex;align-items:center;gap:12px;font-family:var(--font-heading);font-weight:700;font-size:20px;color:var(--text-strong);white-space:nowrap}
.lock img{height:30px;display:block}
img.full{height:34px;display:block}</style></head><body><div class="mono">Assets in images/</div>
<div class="set">
<div class="lock"><img src="../images/contentious-monogram.png" alt=""/>Content Health Check</div>
<img class="full" src="../images/contentious-logo.png" alt="Contentious"/>
</div></body></html>
