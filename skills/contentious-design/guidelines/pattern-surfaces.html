<!-- @dsCard group="Patterns" viewport="700x210" name="One surface depth" subtitle="A slab inside a slab is always wrong. Groups are made by rules and space." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);padding:18px 20px;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
a{color:var(--accent-link)}a:hover{color:var(--accent-link-hover)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.h{font-family:var(--font-heading);font-size:12.5px;margin-bottom:9px}
.bad .h{color:var(--fire-700)}.good .h{color:var(--sapling-800)}
.slab{background:var(--limestone-600);border-radius:8px;padding:12px}
.inner{background:var(--limestone-300);border-radius:6px;padding:11px 13px;margin-top:8px}
.sh{display:flex;align-items:baseline;gap:10px;padding-bottom:9px;border-bottom:1px solid var(--rule-section);margin-bottom:11px}
.sh b{font:var(--type-section);font-size:16px;color:var(--text-strong)}
.sh span{font-size:11px;color:var(--text-muted)}
.band{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-card);border-radius:8px;overflow:hidden}
.band > div{padding:11px 13px}.band > div + div{border-left:1px solid var(--rule-row)}
.l{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--label-color)}
.v{font-family:var(--font-heading-display);font-weight:400;font-size:22px;color:var(--text-strong);margin-top:5px}</style></head><body><div class="two">
<div class="bad"><div class="h">Wrong – slab in a slab</div>
<div class="slab"><div style="font-family:var(--font-heading);font-size:13px;color:var(--text-strong)">Cost</div>
<div class="inner"><div class="l">Total</div><div class="v">$41.28</div></div>
<div class="inner"><div class="l">Per assessment</div><div class="v">$0.0134</div></div></div></div>
<div class="good"><div class="h">Right – rule + one band</div>
<div class="sh"><b>Cost</b><span>last 7 days</span></div>
<div class="band"><div><div class="l">Total</div><div class="v">$41.28</div></div><div><div class="l">Per assessment</div><div class="v">$0.0134</div></div></div></div>
</div></body></html>
