<!-- @dsCard group="Colors" viewport="700x150" name="Gloaming" subtitle="Warm charcoal – all text, and the inverse surface" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);padding:18px 20px;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
a{color:var(--accent-link)}a:hover{color:var(--accent-link-hover)}
.grid{display:grid;grid-template-columns:repeat(17,1fr);gap:2px}.sw{height:56px;border-radius:3px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-family:var(--font-mono);font-size:8px}
.key{display:flex;gap:20px;margin-top:12px}.key div{font-size:11px;color:var(--text-muted)}.key b{font-family:var(--font-mono);font-weight:400;color:var(--text-body)}</style></head><body><div class="grid"><div class="sw" style="background:var(--gloaming-100);color:var(--gloaming-700)">100</div><div class="sw" style="background:var(--gloaming-150);color:var(--gloaming-700)">150</div><div class="sw" style="background:var(--gloaming-200);color:var(--gloaming-700)">200</div><div class="sw" style="background:var(--gloaming-250);color:var(--gloaming-700)">250</div><div class="sw" style="background:var(--gloaming-300);color:var(--gloaming-700)">300</div><div class="sw" style="background:var(--gloaming-350);color:var(--gloaming-700)">350</div><div class="sw" style="background:var(--gloaming-400);color:var(--gloaming-700)">400</div><div class="sw" style="background:var(--gloaming-450);color:var(--gloaming-700)">450</div><div class="sw" style="background:var(--gloaming-500);color:var(--limestone-400)">500</div><div class="sw" style="background:var(--gloaming-550);color:var(--limestone-400)">550</div><div class="sw" style="background:var(--gloaming-600);color:var(--limestone-400)">600</div><div class="sw" style="background:var(--gloaming-650);color:var(--limestone-400)">650</div><div class="sw" style="background:var(--gloaming-700);color:var(--limestone-400)">700</div><div class="sw" style="background:var(--gloaming-750);color:var(--limestone-400)">750</div><div class="sw" style="background:var(--gloaming-800);color:var(--limestone-400)">800</div><div class="sw" style="background:var(--gloaming-850);color:var(--limestone-400)">850</div><div class="sw" style="background:var(--gloaming-900);color:var(--limestone-400)">900</div></div>
<div class="key"><div>strong <b>800</b></div><div>body <b>700</b></div><div>secondary <b>500</b></div><div>muted floor <b>450</b></div><div>zero/empty <b>400</b></div></div></body></html>
