<!-- @dsCard group="Spacing" viewport="700x160" name="Shadow & motion" subtitle="Shadows for floating layers only. 180ms for state, 280ms for reveal." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);padding:18px 20px;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
a{color:var(--accent-link)}a:hover{color:var(--accent-link-hover)}
.set{display:flex;gap:16px}
.s{background:var(--limestone-200);border-radius:8px;width:150px;height:64px;display:grid;place-items:center;font-family:var(--font-mono);font-size:9px;color:var(--text-muted)}
.n{margin-top:16px;font-size:11.5px;color:var(--text-muted);line-height:1.5;max-width:64ch}</style></head><body><div class="mono">--shadow-* / --transition-*</div>
<div class="set" style="margin-top:14px">
<div class="s" style="box-shadow:var(--shadow-sm)">sm · rows</div>
<div class="s" style="box-shadow:var(--shadow-md)">md · tooltip</div>
<div class="s" style="box-shadow:var(--shadow-lg)">lg · menu</div>
</div>
<div class="n">Cards and data surfaces carry <b style="font-family:var(--font-heading);font-weight:400;color:var(--text-strong)">no shadow and no border</b> – they’re separated by hairlines. Shadows mean "this floats above the page".</div></body></html>
