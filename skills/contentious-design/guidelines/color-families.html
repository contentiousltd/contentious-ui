<!-- @dsCard group="Colors" viewport="700x150" name="Supporting families" subtitle="500 stop of each. Wave, sapling and sunshine carry meaning; the rest are chart colour." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);padding:18px 20px;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
a{color:var(--accent-link)}a:hover{color:var(--accent-link-hover)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.f{border-radius:4px;overflow:hidden}.f .c{height:52px}.f .n{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-top:6px}
.f .u{font-size:11px;color:var(--text-secondary);margin-top:2px;line-height:1.3}</style></head><body><div class="grid">
<div class="f"><div class="c" style="background:var(--sunshine-500)"></div><div class="n">sunshine</div><div class="u">warn</div></div><div class="f"><div class="c" style="background:var(--wave-500)"></div><div class="n">wave</div><div class="u">info · series</div></div><div class="f"><div class="c" style="background:var(--sapling-500)"></div><div class="n">sapling</div><div class="u">good</div></div><div class="f"><div class="c" style="background:var(--fire-500)"></div><div class="n">fire</div><div class="u">bad · accent</div></div><div class="f"><div class="c" style="background:var(--coffee-500)"></div><div class="n">coffee</div><div class="u">chart</div></div><div class="f"><div class="c" style="background:var(--amber-500)"></div><div class="n">amber</div><div class="u">warn text</div></div><div class="f"><div class="c" style="background:var(--olive-500)"></div><div class="n">olive</div><div class="u">chart</div></div><div class="f"><div class="c" style="background:var(--sorbet-500)"></div><div class="n">sorbet</div><div class="u">chart</div></div>
</div></body></html>
