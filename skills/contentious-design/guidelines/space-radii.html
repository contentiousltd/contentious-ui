<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="3 chip · 6 control · 6 surface · 12 frame, matching @contentious/ui." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);padding:18px 20px;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
a{color:var(--accent-link)}a:hover{color:var(--accent-link-hover)}
.set{display:flex;gap:14px;align-items:flex-end}
.r{background:var(--surface-card);width:104px;height:66px;display:grid;place-items:center;font-family:var(--font-mono);font-size:9px;color:var(--text-muted)}
.no{background:var(--fire-150);color:var(--fire-700);border-radius:999px}</style></head><body><div class="mono">--radius-*</div>
<div class="set" style="margin-top:12px">
<div class="r" style="border-radius:var(--radius-chip)">chip · 3</div>
<div class="r" style="border-radius:var(--radius-control)">control · 6</div>
<div class="r" style="border-radius:var(--radius-surface)">surface · 6</div>
<div class="r" style="border-radius:var(--radius-frame)">frame · 12</div>
<div class="r no">never 999</div>
</div></body></html>
