<!-- @dsCard group="Type" viewport="700x170" name="Mono – the metadata voice" subtitle="10px, .09em, uppercase, gloaming-450 floor. Labels, not content." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);padding:18px 20px;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
a{color:var(--accent-link)}a:hover{color:var(--accent-link-hover)}
.l{font-family:var(--font-mono);font-size:var(--label-font-size);letter-spacing:var(--label-tracking);text-transform:uppercase;color:var(--label-color)}
.set{display:flex;gap:26px;margin:12px 0 14px}
.n{font-size:11.5px;color:var(--text-muted);line-height:1.5;max-width:62ch}
.bad{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gloaming-300)}</style></head><body><div class="mono">Mono roles</div>
<div class="set"><span class="l">Total API cost</span><span class="l">Account · Clients</span><span class="l">Project</span><span class="l">Switch to</span></div>
<div class="n"><b style="font-family:var(--font-heading);font-weight:400;color:var(--text-strong)">10px is the floor, gloaming-450 is the floor.</b> <span class="bad">This is 9px at gloaming-300</span> – it fails contrast and is the most common defect in review.</div></body></html>
