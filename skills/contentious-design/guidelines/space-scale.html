<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="rem steps. Sections 42px apart, hairline 11px above / 18px below." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);padding:18px 20px;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
a{color:var(--accent-link)}a:hover{color:var(--accent-link-hover)}
.bars{display:flex;align-items:flex-end;gap:10px}
.b{text-align:center}.b i{display:block;background:var(--wave-400);border-radius:2px;height:34px}
.b span{display:block;font-family:var(--font-mono);font-size:8.5px;color:var(--text-muted);margin-top:5px}</style></head><body><div class="mono">--space-*</div>
<div class="bars" style="margin-top:12px">
<div class="b"><i style="width:4px"></i><span>xs<br/>4</span></div><div class="b"><i style="width:8px"></i><span>sm<br/>8</span></div><div class="b"><i style="width:12px"></i><span>md<br/>12</span></div><div class="b"><i style="width:16px"></i><span>lg<br/>16</span></div><div class="b"><i style="width:24px"></i><span>xl<br/>24</span></div><div class="b"><i style="width:32px"></i><span>2xl<br/>32</span></div><div class="b"><i style="width:48px"></i><span>3xl<br/>48</span></div><div class="b"><i style="width:64px"></i><span>4xl<br/>64</span></div><div class="b"><i style="width:96px"></i><span>5xl<br/>96</span></div>
</div></body></html>
