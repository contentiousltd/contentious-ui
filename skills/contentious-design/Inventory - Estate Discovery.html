<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<title>Inventory – Estate Discovery</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="variants/shared.jsx"></script>
<script type="text/babel" src="variants/shared_v2.jsx"></script>
<script type="text/babel" src="variants/inventory_estate.jsx?v=21"></script>

<script type="text/babel">
const accent = getComputedStyle(document.documentElement).getPropertyValue('--fire-500').trim() || '#D5544F';

function App() {
  return (
    <DesignCanvas>

      {/* ── Intro ──────────────────────────────────────────────────────── */}
      <div style={{ padding: '0 60px 40px', maxWidth: 1000 }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '.08em', textTransform: 'uppercase', color: 'rgba(60,50,40,0.6)', marginBottom: 10 }}>Digital estate discovery · IA implications</div>
        <h1 style={{ fontFamily: 'var(--font-heading-display)', fontSize: 56, fontWeight: 400, color: '#1a1918', margin: '0 0 14px', lineHeight: 1.02 }}>Inventory, reimagined.</h1>
        <p style={{ fontFamily: 'var(--font-body)', fontSize: 16, color: '#3d3c3a', maxWidth: '64ch', lineHeight: 1.55, margin: '0 0 12px' }}>
          Estate discovery adds two new upstream layers – Estate and Inventory – that sit before the catalogue and analyses already in the product. This rounds out the four-tier model: <b>Estate → Inventory → Catalogue → Analyses</b>.
        </p>
        <p style={{ fontFamily: 'var(--font-body)', fontSize: 15, color: '#5a524a', maxWidth: '64ch', margin: '0 0 10px' }}>
          <b>The "Inventory" nav item is repurposed</b>, not renamed. The old Inventory (analysed URLs) becomes the Catalogue – a label within this section, not a top-level nav item. The new Inventory covers the whole estate: browse the full URL set, manage what goes in the catalogue, and track freshness across every property.
        </p>
        <p style={{ fontFamily: 'var(--font-body)', fontSize: 15, color: '#5a524a', maxWidth: '64ch', margin: '0 0 10px' }}>
          <b>Nav order shifts</b> to Inventory → Analysis → Results, reflecting that the inventory is upstream: you curate the catalogue before you run analyses.
        </p>
        <p style={{ fontFamily: 'var(--font-body)', fontSize: 15, color: '#5a524a', maxWidth: '64ch', margin: 0 }}>
          <b>Project settings gains "Properties"</b> under a new "Your estate" group. Billing replaces "Pages across account" with two cleaner metrics: Properties and Catalogue entries – the actual tier-gated limits.
        </p>
      </div>

      {/* ── 1 · Estate overview ────────────────────────────────────────── */}
      <DCSection
        title="1 · Inventory – Overview"
        subtitle="The main Inventory page. Shows the 'How this works' collapsible explainer, then the Inventory heading and stats, the whole-estate aggregate card with donuts, and the three per-domain property cards each expanded with section and freshness donuts."
        gap={100}
      >
        <div style={{ position: 'relative' }}>
          <DCArtboard label="Inventory · Overview" width={1200} height={3200}>
            <AB_EstateOverview accent={accent} />
          </DCArtboard>
          <DCPostIt top={60} right={-220} rotate={2} width={230}>
            "How this works" is collapsible – clicking the h2 + caret toggles the four cards. Open by default for new users; returning users can collapse it. No dismiss, no hunting for it later.
          </DCPostIt>
          <DCPostIt top={520} right={-220} rotate={-2} width={230}>
            "The whole estate" aggregate card appears before the individual property cards. Two donuts: pages by property (relative size) and combined content freshness across all domains.
          </DCPostIt>
          <DCPostIt top={980} right={-220} rotate={2} width={230}>
            All three property cards are expanded by default. Each shows section breakdown and content freshness as donut charts, with a tooltip panel on the highlighted segment.
          </DCPostIt>
        </div>
      </DCSection>

      {/* ── 2 · URL browser ────────────────────────────────────────────── */}
      <DCSection
        title="2 · Inventory – Browse"
        subtitle="The URL-level browser. All URLs are in the inventory – type is the only classifier. The default view shows content pages only; 'Show all types' reveals non-content rows (node IDs, file entities, translations, system pages) in a muted style. Search and filter chips narrow the list. The ⋯ menu on the About Sands row shows the 'Reclassify as…' picker – the only inventory action available. Catalogue actions (add/remove) are separate."
        gap={100}
      >
        <div style={{ position: 'relative' }}>
          <DCArtboard label="Inventory · Browse" width={1200} height={680}>
            <AB_InventoryBrowser accent={accent} />
          </DCArtboard>
          <DCPostIt top={60} right={-220} rotate={-2} width={230}>
            "In catalogue: All" filter chip lets users narrow to just their monitored pages. Simple, no new navigation – the catalogue is just a view of the same inventory.
          </DCPostIt>
          <DCPostIt top={280} right={-220} rotate={2} width={230}>
            The only inventory action is "Reclassify as…". Catalogue actions (add/remove) are separate. ↳ Open question: should the catalogue live under Analysis instead, since that’s where you’d see scores alongside each monitored URL?
          </DCPostIt>
          <DCPostIt top={530} right={-220} rotate={-1} width={230}>
            Pagination shows total URLs, content page count, and other-types count – anchors the scope without using the word "excluded".
          </DCPostIt>
        </div>
      </DCSection>

      {/* ── 3 · Catalogue builder + upgrade ────────────────────────────── */}
      <DCSection
        title="3 · Inventory – Overview with upgrade prompt"
        subtitle="The same Inventory Overview page, but for a free-tier user who has hit the 10-entry catalogue limit. The upgrade banner appears naturally in the flow – above the property cards, below the summary stats. The rest of the page is identical to artboard 1."
        gap={100}
      >
        <div style={{ position: 'relative' }}>
          <DCArtboard label="Catalogue builder · Free plan upgrade" width={1200} height={870}>
            <AB_CatalogueAndUpgrade accent={accent} />
          </DCArtboard>
          <DCPostIt top={40} right={-220} rotate={2} width={230}>
            The upgrade ask appears on the normal Inventory page – no special flow, no detour. The concrete framing ("652 pages mapped, 10 monitored") makes the value of upgrading self-evident.
          </DCPostIt>
          <DCPostIt top={320} right={-220} rotate={-2} width={230}>
            Property cards are all collapsed here – the user has already explored the estate. The page is familiar; only the banner is new.
          </DCPostIt>
        </div>
      </DCSection>

      {/* ── 4 · Project settings – Properties ─────────────────────────── */}
      <DCSection
        title="4 · Project settings – Properties"
        subtitle="'Properties' is a new item in the settings sidebar, under a new 'Your estate' group that sits above 'How we audit'. The page lists the three Sands domains with their CMS, last-mapped date, and candidate count. Add and remove are here. Subdomain discovery is surfaced as a dashed-border suggestion. Exclusion patterns are explicitly redirected to the Inventory overview – keeping this page focused on 'what’s in the estate' not 'how to filter it'."
        gap={100}
      >
        <div style={{ position: 'relative' }}>
          <DCArtboard label="Project settings · Properties" width={1200} height={900}>
            <AB_PropertiesSettings accent={accent} />
          </DCArtboard>
          <DCPostIt top={140} right={-220} rotate={-2} width={230}>
            "Your estate" group sits above "How we audit" – estate setup logically precedes configuring the audit criteria. The sidebar group order now mirrors the user’s workflow.
          </DCPostIt>
          <DCPostIt top={540} right={-220} rotate={2} width={230}>
            Exclusions live in the Inventory overview, not here. Settings → Properties is for estate membership (which domains belong to this project). Filtering logic belongs closer to the inventory data itself.
          </DCPostIt>
        </div>
      </DCSection>

      {/* ── 5 · Billing – updated metrics ──────────────────────────────── */}
      <DCSection
        title="5 · Account settings – Billing &amp; plan (updated)"
        subtitle="The 'Pages across account' metric becomes 'Catalogue entries', and 'Properties' is added as a fourth stat. The billing note clarifies that discovery (inventory mapping) is free and unlimited – what counts against the plan is the catalogue size. For Agency, properties is unlimited, so it shows the raw count with no ceiling."
        gap={100}
      >
        <div style={{ position: 'relative' }}>
          <DCArtboard label="Account · Billing &amp; plan" width={1200} height={920}>
            <AB_BillingUpdated accent={accent} />
          </DCArtboard>
          <DCPostIt top={260} right={-220} rotate={2} width={230}>
            Four stats, not three. Properties and catalogue entries are the tier-gated ones – both visible at a glance. The explanatory note under the usage bar ("discovery is free") pre-empts the question every new user will ask.
          </DCPostIt>
        </div>
      </DCSection>

      {/* ── 6 · Soft onboarding ────────────────────────────────────────── */}
      <DCSection
        title="6 · Inventory – new project empty state"
        subtitle="Art Fund: a newly-created project that hasn’t mapped anything yet. The model explainer is shown in full. The empty state offers 'Add your first property' as the primary action and 'Skip for now' as an escape hatch – soft, not hard, onboarding. 'Paste a URL list' provides a power-user bypass for clients who already have a URL list and don’t need discovery."
        gap={100}
      >
        <div style={{ position: 'relative' }}>
          <DCArtboard label="Inventory · Empty state (new project)" width={1200} height={780}>
            <AB_SoftOnboarding accent={accent} />
          </DCArtboard>
          <DCPostIt top={180} right={-220} rotate={-2} width={230}>
            "Skip for now" means the user can go straight to Analysis if they already have a URL. The product still works without estate discovery – it just gets much better with it.
          </DCPostIt>
          <DCPostIt top={420} right={-220} rotate={2} width={230}>
            "Paste a URL list" is the power-user path. Agencies onboarding a client site they know well can skip discovery entirely and go straight to catalogue setup.
          </DCPostIt>
        </div>
      </DCSection>

      {/* ── Summary ────────────────────────────────────────────────────── */}
      <div style={{ padding: '40px 60px 80px', maxWidth: 960 }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '.08em', textTransform: 'uppercase', color: 'rgba(60,50,40,0.6)', marginBottom: 10 }}>Summary of changes</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 40 }}>
          <div>
            <div style={{ fontFamily: 'var(--font-heading-display)', fontSize: 22, color: '#1a1918', marginBottom: 12 }}>Navigation</div>
            <ul style={{ fontFamily: 'var(--font-body)', fontSize: 15, color: '#3d3c3a', lineHeight: 1.7, paddingLeft: 18, margin: 0 }}>
              <li>Order: Inventory → Analysis → Results (Inventory is now upstream)</li>
              <li>"Inventory" nav item: repurposed, not renamed – it now covers the full estate</li>
              <li>Sub-nav within Inventory: Overview | Browse</li>
              <li>"Catalogue" is a label and concept within Inventory, not its own nav item</li>
            </ul>
          </div>
          <div>
            <div style={{ fontFamily: 'var(--font-heading-display)', fontSize: 22, color: '#1a1918', marginBottom: 12 }}>Settings & billing</div>
            <ul style={{ fontFamily: 'var(--font-body)', fontSize: 15, color: '#3d3c3a', lineHeight: 1.7, paddingLeft: 18, margin: 0 }}>
              <li>Project settings: new "Your estate" group with <b>Properties</b></li>
              <li>Billing: "Pages across account" → <b>Catalogue entries</b></li>
              <li>Billing: <b>Properties</b> added as a new tier-gated metric</li>
              <li>Billing note: discovery is free; catalogue entries are what counts</li>
            </ul>
          </div>
        </div>

        <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '.08em', textTransform: 'uppercase', color: 'rgba(60,50,40,0.6)', margin: '36px 0 10px' }}>Open questions</div>
        <ol style={{ fontFamily: 'var(--font-body)', fontSize: 15, color: '#3d3c3a', lineHeight: 1.7, paddingLeft: 22, margin: 0, maxWidth: '66ch' }}>
          <li>Should the Browse sub-nav show the candidate count as a badge? e.g. "Browse <span style={{fontFamily:'var(--font-mono)', fontSize:13}}>652</span>". Makes it scannable before you enter.</li>
          <li>Exclusion patterns: currently redirected from Properties settings to the Inventory overview. Is that the right home? They could also live in a dedicated tab within Inventory (Overview | Browse | Exclusions).</li>
          <li>Should the Catalogue sidebar in the builder show the <i>analysis</i> state of each entry (last scored, score trend) – blending discovery and results in one place?</li>
          <li>"Content Inventory" tab in the existing content-management.tsx should be renamed to "Catalogue" per the spec. Confirm this is in scope for the same release.</li>
          <li>The project switcher currently shows a domain hint per project. With multi-domain projects, what replaces it? Options: primary domain + "…", total properties count, or no hint at all (project name is enough).</li>
        </ol>
      </div>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
