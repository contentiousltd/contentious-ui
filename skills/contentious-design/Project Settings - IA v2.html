<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<title>IA v2 – project as scope</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body { margin:0; padding:0; background:#f0eee9; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="variants/shared.jsx"></script>
<script type="text/babel" src="variants/shared_v2.jsx?v=3"></script>
<script type="text/babel" src="variants/ia_v2.jsx?v=3"></script>
<script type="text/babel" src="variants/ia_v2_extras.jsx?v=3"></script>

<script type="text/babel">
const accent = getComputedStyle(document.documentElement).getPropertyValue('--fire-500').trim() || '#D5544F';

// Patch AB_Account to remove the gradient (cache-busting override)
window.AB_Account = function AB_Account({ accent }) {
  const nav = [
    { group:'', items:['Profile'] },
    { group:'Organisation', items:['Members & teams','Billing & plan','Integrations'] },
    { group:'', items:['Notifications','Security'] },
  ];
  return (
    <div style={{ background:'var(--limestone)', minHeight:'100%', fontFamily:'var(--font-body)', color:'var(--gloaming)', fontSize:15, display:'flex', flexDirection:'column' }}>
      <TopBarV2 accent={accent} mode="agency" current="Sands"/>
      <div style={{ display:'grid', gridTemplateColumns:'260px 1fr' }}>
        <aside style={{ padding:'40px 20px 40px 32px', borderRight:'1px solid var(--limestone-extra-dark)', background:'var(--limestone)', minHeight:'100%' }}>
          <div style={{ marginBottom:24 }}>
            <div style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--gloaming-pale)', marginBottom:4 }}>Account settings</div>
            <div style={{ fontFamily:'var(--font-heading-display)', fontSize:22, color:'var(--gloaming-dark)', lineHeight:1.1 }}>Contentious Ltd</div>
          </div>
          {nav.map((g,gi) => (
            <div key={gi} style={{ marginTop: g.group ? 20 : 8 }}>
              {g.group && <div style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--gloaming-pale)', padding:'0 12px 8px' }}>{g.group}</div>}
              {g.items.map(item => {
                const isActive = item === 'Billing & plan';
                return (
                  <div key={item} style={{ padding:'9px 12px', borderRadius:6, marginBottom:2, fontFamily:'var(--font-heading)', fontSize:14, background: isActive ? 'var(--gloaming-dark)' : 'transparent', color: isActive ? 'var(--limestone)' : 'var(--gloaming)', cursor:'pointer' }}>{item}</div>
                );
              })}
            </div>
          ))}
          <div style={{ marginTop:40, padding:'16px', borderTop:'1px dashed var(--limestone-extra-dark)' }}>
            <div style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--gloaming-pale)', marginBottom:8 }}>Elsewhere</div>
            <div style={{ fontFamily:'var(--font-heading)', fontSize:13, color:'var(--gloaming-pale)', lineHeight:1.7 }}>
              Project settings <span style={{ float:'right' }}>↗</span><br/>
              All projects <span style={{ float:'right' }}>↗</span>
            </div>
          </div>
        </aside>
        <main style={{ padding:'48px 56px 80px', maxWidth:820 }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:14, fontFamily:'var(--font-mono)', fontSize:11, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--gloaming-pale)' }}>
            <span>Account</span><span>·</span><span style={{ color:'var(--gloaming-dark)' }}>Billing & plan</span>
          </div>
          <h1 style={{ fontFamily:'var(--font-heading-display)', fontSize:52, fontWeight:400, color:'var(--gloaming-dark)', margin:'0 0 8px', lineHeight:1.05 }}>Billing & plan</h1>
          <p style={{ maxWidth:'56ch', fontSize:16, color:'var(--gloaming)', margin:'0 0 32px' }}>One plan covers every project in your account. Upgrade when you need more pages, members or projects.</p>
          <div style={{ border:`1.5px solid ${accent}`, borderRadius:12, padding:'28px 32px', background:'var(--limestone-pale)', marginBottom:24 }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
              <div>
                <div style={{ fontFamily:'var(--font-mono)', fontSize:11, letterSpacing:'.08em', textTransform:'uppercase', color: accent, marginBottom:6 }}>Current plan</div>
                <div style={{ fontFamily:'var(--font-heading-display)', fontSize:40, color:'var(--gloaming-dark)', lineHeight:1 }}>Agency</div>
                <div style={{ fontSize:14, color:'var(--gloaming-pale)', marginTop:6 }}>£249 / month · renews 3 June</div>
              </div>
              <Button accent={accent} kind="secondary">Change plan</Button>
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16, marginTop:24, paddingTop:24, borderTop:'1px solid var(--limestone-extra-dark)' }}>
              {[{ l:'Projects', v:'5 / 10' }, { l:'Pages across account', v:'7,069 / 25,000' }, { l:'Members', v:'4 / unlimited' }].map(s => (
                <div key={s.l}>
                  <div style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--gloaming-pale)', marginBottom:4 }}>{s.l}</div>
                  <div style={{ fontFamily:'var(--font-heading)', fontSize:16, color:'var(--gloaming-dark)' }}>{s.v}</div>
                </div>
              ))}
            </div>
          </div>
          <h3 style={{ fontFamily:'var(--font-heading)', fontSize:18, fontWeight:400, color:'var(--gloaming-dark)', margin:'32px 0 12px' }}>Payment method</h3>
          <div style={{ background:'var(--limestone-pale)', borderRadius:8, padding:'16px 20px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <div>
              <div style={{ fontFamily:'var(--font-heading)', fontSize:15, color:'var(--gloaming-dark)' }}>Visa ending 4242</div>
              <div style={{ fontSize:13, color:'var(--gloaming-pale)' }}>Expires 08/2027</div>
            </div>
            <span style={{ color: accent, fontFamily:'var(--font-heading)', fontSize:14, cursor:'pointer' }}>Update</span>
          </div>
        </main>
      </div>
      <AppFooter accent={accent}/>
    </div>
  );
};

function App() {
  return (
    <DesignCanvas>
      <div style={{ padding:'0 60px 40px', maxWidth:1000 }}>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:11, letterSpacing:'.08em', textTransform:'uppercase', color:'rgba(60,50,40,0.6)', marginBottom:10 }}>IA v2 · project as scope</div>
        <h1 style={{ fontFamily:'var(--font-heading-display)', fontSize:56, fontWeight:400, color:'#1a1918', margin:'0 0 14px', lineHeight:1.02 }}>Project is the scope, not a setting.</h1>
        <p style={{ fontFamily:'var(--font-body)', fontSize:16, color:'#3d3c3a', maxWidth:'62ch', lineHeight:1.55, margin:'0 0 14px' }}>
          Everything below is organised around a single principle: the project scopes the whole app. Switcher lives in the top-left as the primary anchor. Inventory, Analysis and Results are all project-scoped. Framework stays prominent – signed in <i>or</i> out – because it’s the expertise the app rests on.
        </p>
        <p style={{ fontFamily:'var(--font-body)', fontSize:15, color:'#5a524a', maxWidth:'62ch', margin:'0 0 14px' }}>
          <b>Settings splits honestly:</b> Project settings (per-project: overview, brand & strategy, taxonomy, audit schedule, danger zone) and Account settings (global: members, notifications, integrations, billing). The two renamed config pages – <b>Brand & strategy</b> (was "Content") and <b>Taxonomy</b> (was "Structures") – live inside Project settings, not in top nav.
        </p>
        <p style={{ fontFamily:'var(--font-body)', fontSize:15, color:'#5a524a', maxWidth:'62ch', margin:'0 0 14px' }}>
          <b>The switcher adapts.</b> Solo users with one project see a quiet label. Agencies see a prominent, searchable switcher with recents. Either way it’s in the same place, so the UI doesn’t jump around as you grow from one project to many.
        </p>
        <p style={{ fontFamily:'var(--font-body)', fontSize:15, color:'#5a524a', maxWidth:'62ch', margin:0 }}>
          <b>Inventory gets promoted</b> to sibling of Analysis/Results. With monthly re-assessments coming, it’s an active working surface, not a nested report.
        </p>
      </div>

      <DCSection
        title="1 · Project settings – the main page"
        subtitle="Agency context (multi-project). Switcher visible, settings sub-nav on the left. The main content is just metadata – the interesting config lives in the sub-nav items."
        gap={100}
      >
        <div style={{ position:'relative' }}>
          <DCArtboard label="Project settings · Overview" width={1200} height={900}>
            <AB_ProjectSettings accent={accent}/>
          </DCArtboard>
          <DCPostIt top={-10} right={-200} rotate={3} width={240}>
            "Elsewhere" block in the sidebar is the escape hatch to Account and All projects – tells users where the other-shaped settings went.
          </DCPostIt>
        </div>
      </DCSection>

      <DCSection
        title="2 · Switcher open – how agencies navigate"
        subtitle="Click the project name top-left. Search + recents + 'Manage all projects' link."
        gap={100}
      >
        <div style={{ position:'relative' }}>
          <DCArtboard label="Project switcher dropdown" width={1200} height={720}>
            <AB_SwitcherOpen accent={accent}/>
          </DCArtboard>
          <DCPostIt top={20} right={-200} rotate={-2} width={240}>
            ⌘K opens the switcher with search focus. Anchoring the keyboard shortcut to project-scope makes multi-project work feel instant.
          </DCPostIt>
        </div>
      </DCSection>

      <DCSection
        title="3 · Signed-out – Framework &amp; About in nav; footer for signed-in users"
        subtitle="Anon users see Framework + About in the header – they’re the whole sell for a visitor. Once signed in, those links leave the nav and reappear in the page footer alongside Privacy."
        gap={100}
      >
        <DCArtboard label="Anon · Framework-forward" width={1200} height={800}>
          <AB_Anon accent={accent}/>
        </DCArtboard>
      </DCSection>

      <DCSection
        title="4 · Solo user – one project, quieter chrome"
        subtitle="Same structure, same sub-nav. The switcher becomes a muted label. No dropdown – there’s nowhere to switch to. Users never see 'project management' UI they don’t need."
        gap={100}
      >
        <div style={{ position:'relative' }}>
          <DCArtboard label="Solo · Brand & strategy (was 'Content')" width={1200} height={840}>
            <AB_Solo accent={accent}/>
          </DCArtboard>
          <DCPostIt top={-10} right={-200} rotate={3} width={240}>
            If they ever add a second project, the switcher lights up automatically. No UI flag day.
          </DCPostIt>
        </div>
      </DCSection>

      <DCSection
        title="5 · Audit schedule – the new monthly re-assessment"
        subtitle="Per-project. Mostly automated – change detection means routine re-scoring is nearly invisible. Users only touch this when something’s off."
        gap={100}
      >
        <DCArtboard label="Audit schedule" width={1200} height={860}>
          <AB_Schedule accent={accent}/>
        </DCArtboard>
      </DCSection>

      <DCSection
        title="6 · Avatar menu – where Billing, Members & Account live"
        subtitle="Top-right avatar opens the account realm. Clear split: project-scoped stuff is in the left sub-nav on every project page; account-scoped stuff is here."
        gap={100}
      >
        <div style={{ position:'relative' }}>
          <DCArtboard label="Avatar menu open" width={1200} height={720}>
            <AB_AvatarMenu accent={accent}/>
          </DCArtboard>
          <DCPostIt top={60} right={-200} rotate={2} width={240}>
            Members & teams, Billing, Integrations, Notifications are all org-wide – so they sit under the account, not any one project.
          </DCPostIt>
        </div>
      </DCSection>

      <DCSection
        title="7 · Members & teams – the org roster"
        subtitle="Org-level only, no project-level roles. One roster; every member sees every project. Clean Clerk mapping, zero custom permission matrix."
        gap={100}
      >
        <div style={{ position:'relative' }}>
          <DCArtboard label="Account · Members & teams" width={1200} height={900}>
            <AB_Members accent={accent}/>
          </DCArtboard>
          <DCPostIt top={-10} right={-210} rotate={3} width={250}>
            Need walled-off access for competing clients? Spin up a separate account. Keeps the mental model honest.
          </DCPostIt>
        </div>
      </DCSection>

      <DCSection
        title="8 · Universal dropdown – how users reach Project settings"
        subtitle="Every user clicks Sands ▾. Solo gets two rows (Project settings / New project). Agency gets the full switcher with cog-on-hover per row. Same anchor, same gesture – different content."
        gap={100}
      >
        <div style={{ position:'relative' }}>
          <DCArtboard label="Solo & agency dropdowns" width={1200} height={1200}>
            <AB_UniversalDropdown accent={accent}/>
          </DCArtboard>
          <DCPostIt top={60} right={-210} rotate={3} width={250}>
            Removes the solo +. Project settings becomes discoverable for everyone from day one, via the same menu. No special-case chrome.
          </DCPostIt>
        </div>
      </DCSection>

      <DCSection
        title="9 · New project modal"
        subtitle="Triggered by the solo + or the switcher’s '+ New project.' Option to inherit brand & strategy / taxonomy / schedule from an existing project so agencies don’t reconfigure for each client."
        gap={100}
      >
        <div style={{ position:'relative' }}>
          <DCArtboard label="Create project" width={1200} height={900}>
            <AB_NewProjectModal accent={accent}/>
          </DCArtboard>
          <DCPostIt top={80} right={-210} rotate={-2} width={250}>
            "Copy settings from Sands" is the agency shortcut. Keeps setup under 30 seconds when onboarding a new client site.
          </DCPostIt>
        </div>
      </DCSection>

      <DCSection
        title="10 · Switcher button – current vs refined"
        subtitle="Only the closed-state button. The open dropdown stays as-is (you approved it). Comparing the form-control style against a typographic breadcrumb feel."
        gap={100}
      >
        <DCArtboard label="Closed-state button comparison" width={1200} height={560}>
          <AB_SwitcherButtons accent={accent}/>
        </DCArtboard>
      </DCSection>

      <DCSection
        title="11 · Account settings – Billing & plan"
        subtitle="Mirror of Project settings' structure, but org-scoped. 'Elsewhere' block points back to Project settings so users don’t get lost between the two realms."
        gap={100}
      >
        <DCArtboard label="Account · Billing & plan" width={1200} height={900}>
          <AB_Account accent={accent}/>
        </DCArtboard>
      </DCSection>

      <div style={{ padding:'40px 60px 80px', maxWidth:960 }}>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:11, letterSpacing:'.08em', textTransform:'uppercase', color:'rgba(60,50,40,0.6)', marginBottom:10 }}>Answers to your questions</div>
        <div style={{ fontFamily:'var(--font-body)', fontSize:15, color:'#3d3c3a', lineHeight:1.7, maxWidth:'64ch', marginBottom:32 }}>
          <p style={{ margin:'0 0 10px' }}><b>Billing & team management:</b> avatar menu (top-right) → Account settings. See artboards 6 & 7. This separates the org-scoped realm from the project-scoped one.</p>
          <p style={{ margin:'0 0 10px' }}><b>Title:</b> kept as "Content Health Check" (matches the URL).</p>
          <p style={{ margin:'0 0 10px' }}><b>Nav order:</b> Analysis → Results → Inventory, reflecting chronology of use.</p>
          <p style={{ margin:0 }}><b>Logo:</b> swapped to the clipboard mark.</p>
        </div>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:11, letterSpacing:'.08em', textTransform:'uppercase', color:'rgba(60,50,40,0.6)', marginBottom:10 }}>Summary of IA changes</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:32 }}>
          <div>
            <div style={{ fontFamily:'var(--font-heading-display)', fontSize:22, color:'#1a1918', marginBottom:10 }}>Top nav</div>
            <ul style={{ fontFamily:'var(--font-body)', fontSize:15, color:'#3d3c3a', lineHeight:1.7, paddingLeft:18, margin:0 }}>
              <li>Project switcher moves to top-left, beside the logo</li>
              <li>Inventory promoted to top nav (sibling of Analysis / Results)</li>
              <li>Framework stays visible – signed in <i>and</i> out</li>
              <li>Avatar menu holds Account settings, All projects, Sign out</li>
            </ul>
          </div>
          <div>
            <div style={{ fontFamily:'var(--font-heading-display)', fontSize:22, color:'#1a1918', marginBottom:10 }}>Settings reorganised</div>
            <ul style={{ fontFamily:'var(--font-body)', fontSize:15, color:'#3d3c3a', lineHeight:1.7, paddingLeft:18, margin:0 }}>
              <li>Old "Projects" tab → deleted (switcher replaces it)</li>
              <li>Old "Content" → <b>Brand & strategy</b> (under Project settings)</li>
              <li>Old "Structures" → <b>Taxonomy</b> (under Project settings)</li>
              <li>New: <b>Audit schedule</b> for monthly re-assessments</li>
              <li>Account settings splits off as its own global realm</li>
            </ul>
          </div>
        </div>

        <div style={{ fontFamily:'var(--font-mono)', fontSize:11, letterSpacing:'.08em', textTransform:'uppercase', color:'rgba(60,50,40,0.6)', margin:'40px 0 10px' }}>Open questions</div>
        <ol style={{ fontFamily:'var(--font-body)', fontSize:15, color:'#3d3c3a', lineHeight:1.7, paddingLeft:22, margin:0, maxWidth:'64ch' }}>
          <li>Are "Brand & strategy" and "Taxonomy" the right names? Open to alternatives – "Your standards" / "Sections & types" / "Organisation" were runners-up.</li>
          <li>Should Members live in Account (global) or Project settings (per-project permissions)? I’ve put it in Account; let me know if per-project roles are real.</li>
          <li>When a solo user creates a second project, what’s the prompt? An in-context nudge ("Add another site") or just a menu item?</li>
          <li>Billing – per-account or per-project? Affects where it lives.</li>
        </ol>
      </div>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
