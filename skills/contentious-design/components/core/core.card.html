<!-- @dsCard group="Components" viewport="700x340" name="Core – chips, buttons, switch, card" subtitle="One chip geometry in six tones; four button variants; the neutral-off switch" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><title>Core components</title>
<link rel="stylesheet" href="../../styles.css"/>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);font-size:16px;line-height:var(--line-height-normal);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-synthesis-weight:none}a{color:var(--accent-link);text-decoration:none}a:hover{color:var(--accent-link-hover)}
.pad{padding:20px 24px}.stack{display:flex;flex-direction:column;gap:18px}
.set{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);margin-bottom:9px}</style>
</head><body>
<div class="pad"><div class="stack">
<div><div class="cap">Chip · six tones, one geometry</div><div class="set">
<span class="c-chip">Member</span>
<span class="c-chip c-chip--info">Current</span>
<span class="c-chip c-chip--good">Healthy · 78</span>
<span class="c-chip c-chip--warn">Invited</span>
<span class="c-chip c-chip--bad">Failed</span>
<span class="c-chip c-chip--info"><span class="c-chip__dot"></span>Analysing</span>
<span class="c-chip c-chip--promo">2 months free</span>
</div></div>
<div><div class="cap">Button</div><div class="set">
<button class="c-button">Add client</button>
<button class="c-button c-button--ghost">Manage credits</button>
<button class="c-button c-button--quiet c-button--sm">Settings</button>
<button class="c-button c-button--danger c-button--sm">Delete project</button>
<button class="c-button" disabled>Save banner</button>
</div></div>
<div><div class="cap">Switch · off gives up the fill</div><div class="set" style="gap:34px">
<label class="c-switch"><input type="checkbox"/><span class="c-switch__track"><span class="c-switch__knob"></span></span><span class="c-switch__label">Banner is <b>hidden</b></span></label>
<label class="c-switch"><input type="checkbox" checked/><span class="c-switch__track"><span class="c-switch__knob"></span></span><span class="c-switch__label">Banner is <b>shown</b></span></label>
</div></div>
<div><div class="cap">Card · chips straddle the edge, grouped left</div>
<div class="c-card-row" style="grid-template-columns:1fr 1fr">
<div class="c-card"><div class="c-card__title">Organisation</div><div class="c-card__sub">5,000 checks / month</div></div>
<div class="c-card c-card--selected"><div class="c-card__chips"><span class="c-chip c-chip--bad">Selected</span><span class="c-chip c-chip--info">Current</span></div><div class="c-card__title">Agency</div><div class="c-card__sub">10,000 checks / month</div></div>
</div></div>
</div></div></body></html>
